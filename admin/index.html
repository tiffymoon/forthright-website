<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Forthright Events</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">
        <img src="../images/logo.png" alt="Forthright Events" style="height:36px;width:auto;">
      </div>
      <h1>Forthright Events</h1>
      <p>Admin Panel</p>
    </div>
    <label for="login-email">Email</label>
    <input type="email" id="login-email" placeholder="admin@example.com" autocomplete="username">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    <div class="login-error" id="login-error"></div>
    <button id="login-btn" onclick="login()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <nav class="admin-nav">
    <div class="admin-nav-logo">
      <img src="../images/forthright-icon.png" alt="Forthright Events" style="height:36px;width:auto;">
      Forthright Admin
    </div>
    <div class="admin-nav-right">
      <a href="#" onclick="switchTab('events', this); return false;">Events</a>
      <a href="#" onclick="switchTab('clients', this); return false;">Clients</a>
      <a href="../index.html" target="_blank">View Site ↗</a>
      <button id="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <main class="admin-main">



  <!-- EVENTS TAB -->
  <div id="tab-events">
    <section class="admin-section">
      <div class="admin-section-header">
        <h2>Events</h2>
        <button class="btn-add" onclick="openForm()">+ Add Event</button>
      </div>
      <div class="table-wrap">
        <table class="events-table">
          <thead>
            <tr>
              <th onclick="sortEvents('title')">Title <span class="sort-icon" id="sort-title">↕</span></th>
              <th onclick="sortEvents('clients')">Client <span class="sort-icon" id="sort-clients">↕</span></th>
              <th onclick="sortEvents('category')">Category <span class="sort-icon" id="sort-category">↕</span></th>
              <th onclick="sortEvents('event_date')">Date <span class="sort-icon" id="sort-event_date">↕</span></th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="events-tbody"><tr><td colspan="6" class="loading-cell">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- CLIENTS TAB -->
  <div id="tab-clients" style="display:none;">
    <section class="admin-section">
      <div class="admin-section-header">
        <h2>Clients</h2>
        <button class="btn-add" onclick="openClientForm()">+ Add Client</button>
      </div>
      <p class="section-hint">Check "Featured" to show a client's logo on the homepage.</p>
      <div class="table-wrap">
        <table class="events-table">
          <thead><tr><th>Name</th><th>Logo</th><th>Featured</th><th>Actions</th></tr></thead>
          <tbody id="clients-tbody"><tr><td colspan="6" class="loading-cell">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

  </div>

</main>

<!-- OVERLAY -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeAllDrawers()"></div>

<!-- EVENT DRAWER -->
<div class="drawer" id="event-drawer">
  <div class="drawer-header">
    <h3 id="form-title">Add New Event</h3>
    <button class="drawer-close" onclick="cancelEdit()">✕</button>
  </div>
  <div class="drawer-body">
    <div class="form-grid">
      <div class="form-group full">
        <label>Event Title *</label>
        <input type="text" id="f-title" placeholder="e.g. PLDT Annual Badminton Cup 2025">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="f-category">
          <option value="">— Select —</option>
          <option>Sports Tournament</option>
          <option>Team Building</option>
          <option>Events & Celebrations</option>
        </select>
      </div>
      <div class="form-group">
        <label>Client</label>
        <select id="f-client_id">
          <option value="">— No client —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Start Date *</label>
        <input type="date" id="f-event_date">
      </div>
      <div class="form-group">
        <label>End Date <span class="label-hint">(leave blank if single day)</span></label>
        <input type="date" id="f-end_date">
      </div>
      <div class="form-group full">
        <label>Venue</label>
        <input type="text" id="f-location" placeholder="e.g. Ynares Sports Arena, Pasig City">
      </div>
      <div class="form-group full">
        <label>Google Maps URL <span class="label-hint">(optional)</span></label>
        <input type="url" id="f-location_url" placeholder="https://maps.google.com/…">
      </div>
      <div class="form-group full">
        <label>Cover Image</label>
        <input type="file" id="f-cover_image_file" accept="image/*">
        <input type="hidden" id="f-cover_image">
        <div id="cover-preview" style="margin-top:.75rem;display:none;">
          <img id="cover-preview-img" style="height:120px;border-radius:8px;object-fit:cover;">
        </div>
      </div>
      <div class="form-group full" id="album-field-row" style="display:none;">
        <label>Photo Album URL <span class="label-hint">(past events only)</span></label>
        <input type="url" id="f-facebook_album" placeholder="https://www.facebook.com/media/set/…">
      </div>
      <div class="form-group full">
        <label>Description</label>
        <textarea id="f-description" rows="5" placeholder="Describe the event…"></textarea>
      </div>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn-primary" id="saveBtn" onclick="saveEvent()">Save Event</button>
    <button class="btn-outline-dark" onclick="cancelEdit()">Cancel</button>
    <div class="save-note" id="saveNote"></div>
  </div>
</div>

<!-- CLIENT DRAWER -->
<div class="drawer" id="client-drawer">
  <div class="drawer-header">
    <h3 id="client-form-title">Add Client</h3>
    <button class="drawer-close" onclick="cancelClientEdit()">✕</button>
  </div>
  <div class="drawer-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Client Name *</label>
        <input type="text" id="fc-name" placeholder="e.g. PLDT">
      </div>
      <div class="form-group">
        <label>Sort Order <span class="label-hint">(lower = appears first)</span></label>
        <input type="number" id="fc-sort_order" placeholder="0" min="0">
      </div>
      <div class="form-group full">
        <label>Logo</label>
        <input type="file" id="fc-logo_file" accept="image/*">
        <input type="hidden" id="fc-logo_url">
        <div id="logo-preview" style="margin-top:.75rem;display:none;">
          <img id="logo-preview-img" style="height:48px;object-fit:contain;">
        </div>
      </div>
      <div class="form-group full">
        <label class="toggle-label">
          <input type="checkbox" id="fc-featured" checked>
          <span class="toggle-text">Show on homepage</span>
        </label>
      </div>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn-primary" id="saveClientBtn" onclick="saveClient()">Save Client</button>
    <button class="btn-outline-dark" onclick="cancelClientEdit()">Cancel</button>
  </div>
</div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
