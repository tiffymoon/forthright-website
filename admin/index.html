<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Forthright Events</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">🏆</div>
      <h1>Forthright Events</h1>
      <p>Admin Panel</p>
    </div>
    <label for="login-email">Email</label>
    <input type="email" id="login-email" placeholder="admin@example.com" autocomplete="username">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    <div class="login-error" id="login-error"></div>
    <button id="login-btn" onclick="login()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <nav class="admin-nav">
    <div class="admin-nav-logo"><span>🏆</span> Forthright Admin</div>
    <div class="admin-nav-right">
      <a href="../index.html" target="_blank">View Site ↗</a>
      <button id="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <main class="admin-main">

    <!-- ══ EVENTS ══ -->
    <section class="admin-section">
      <div class="admin-section-header">
        <h2>Events</h2>
        <button class="btn-add" onclick="openForm()">+ Add Event</button>
      </div>
      <div class="table-wrap">
        <table class="events-table">
          <thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="events-tbody"><tr><td colspan="5" class="loading-cell">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- Event Form -->
    <section class="admin-section" id="form-section" style="display:none;">
      <div class="form-card">
        <div class="form-card-header">
          <h3 id="form-title">Add New Event</h3>
        </div>
        <div class="form-card-body">
          <div class="form-grid">
            <div class="form-group full">
              <label>Event Title *</label>
              <input type="text" id="f-title" placeholder="e.g. PLDT Annual Badminton Cup 2025">
            </div>
            <div class="form-group">
              <label>Category *</label>
              <select id="f-category">
                <option value="">— Select —</option>
                <option>Badminton</option>
                <option>Basketball</option>
                <option>Volleyball</option>
                <option>Football</option>
                <option>Flag Football</option>
                <option>Bowling</option>
                <option>Team Building</option>
                <option>Corporate Event</option>
                <option>Social</option>
              </select>
            </div>
            <div class="form-group">
              <label>Date *</label>
              <input type="date" id="f-event_date">
            </div>
            <div class="form-group">
              <label>Time</label>
              <input type="text" id="f-event_time" placeholder="e.g. 8:00 AM – 5:00 PM">
            </div>
            <div class="form-group">
              <label>Price / Registration Fee</label>
              <input type="text" id="f-price" placeholder="e.g. ₱1,500 per team">
            </div>
            <div class="form-group full">
              <label>Venue</label>
              <input type="text" id="f-location" placeholder="e.g. Ynares Sports Arena, Pasig City">
            </div>
            <div class="form-group">
              <label>Capacity / Spots</label>
              <input type="text" id="f-spots" placeholder="e.g. 16 teams, 300 pax">
            </div>
            <div class="form-group">
              <label>Cover Image URL</label>
              <input type="url" id="f-cover_image" placeholder="https://…">
            </div>
            <div class="form-group full" id="album-field-row" style="display:none;">
              <label>Photo Album URL <span class="label-hint">(Facebook album — only shown for past events)</span></label>
              <input type="url" id="f-facebook_album" placeholder="https://www.facebook.com/media/set/…">
            </div>
            <div class="form-group full">
              <label class="toggle-label">
                <input type="checkbox" id="f-featured">
                <span class="toggle-text">Mark as featured event</span>
              </label>
            </div>
            <div class="form-group full">
              <label>Description</label>
              <textarea id="f-description" rows="5" placeholder="Describe the event — format, what's included, who it's for…"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn-primary" id="saveBtn" onclick="saveEvent()">Save Event</button>
            <button class="btn-outline-dark" onclick="cancelEdit()">Cancel</button>
            <div class="save-note" id="saveNote"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ══ CLIENTS ══ -->
    <section class="admin-section" style="margin-top:3rem;">
      <div class="admin-section-header">
        <h2>Clients</h2>
        <button class="btn-add" onclick="openClientForm()">+ Add Client</button>
      </div>
      <p class="section-hint">Check the "Featured" checkbox to show a client's logo on the homepage.</p>
      <div class="table-wrap">
        <table class="events-table">
          <thead><tr><th>Name</th><th>Logo Preview</th><th>Featured on Homepage</th><th>Actions</th></tr></thead>
          <tbody id="clients-tbody"><tr><td colspan="4" class="loading-cell">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- Client Form -->
    <section class="admin-section" id="client-form-section" style="display:none;">
      <div class="form-card">
        <div class="form-card-header">
          <h3 id="client-form-title">Add Client</h3>
        </div>
        <div class="form-card-body">
          <div class="form-grid">
            <div class="form-group">
              <label>Client Name *</label>
              <input type="text" id="fc-name" placeholder="e.g. PLDT">
            </div>
            <div class="form-group">
              <label>Sort Order <span class="label-hint">(lower = appears first)</span></label>
              <input type="number" id="fc-sort_order" placeholder="0" min="0">
            </div>
            <div class="form-group full">
              <label>Logo URL <span class="label-hint">(paste a direct link to the logo image)</span></label>
              <input type="url" id="fc-logo_url" placeholder="https://…">
            </div>
            <div class="form-group full">
              <label class="toggle-label">
                <input type="checkbox" id="fc-featured" checked>
                <span class="toggle-text">Show on homepage</span>
              </label>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn-primary" id="saveClientBtn" onclick="saveClient()">Save Client</button>
            <button class="btn-outline-dark" onclick="cancelClientEdit()">Cancel</button>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
